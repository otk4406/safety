<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b35"><title>현장안전포털 | SAFETY</title>
<style>
:root{--g:#176b52;--nav:#123b35;--ink:#192a25;--muted:#718079;--line:#e5ebe7;--bg:#f4f7f5;--mint:#e8f4ee;--red:#b74637}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,'Noto Sans KR',sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--nav);color:white;padding:24px 14px}.brand{font-size:19px;font-weight:800;padding:8px;margin-bottom:25px}.nav{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;color:#d9e8e1;padding:13px;margin:4px 0;cursor:pointer}.nav.active,.nav:hover{background:#ffffff20;color:white}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 5px 18px #173d3408}.card h3{font-size:14px;margin:0 0 13px}.num{font-size:27px;font-weight:800}.btn{border:1px solid var(--line);background:white;border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:700}.primary{background:var(--g);color:white;border-color:var(--g)}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:10px;font:inherit;max-width:100%}input,textarea{width:100%}textarea{min-height:70px}label{font-size:12px;font-weight:700;display:block;margin:10px 0 5px}.row{display:flex;gap:8px;align-items:center}.weather{display:flex;align-items:center;gap:16px;min-height:95px}.temp{font-size:35px;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calendar button{border:0;border-radius:7px;background:transparent;padding:9px 2px;cursor:pointer}.calendar button.today{background:var(--g);color:white}.calendar button.mark{box-shadow:inset 0 -3px #e0a33c}.calendar button.sel{outline:2px solid #8bc9a8}.weekday{font-size:11px;color:var(--muted);padding:7px}.list{display:grid;gap:8px;margin-top:12px}.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:8px;background:#fff;font-size:12px}.item small{color:var(--muted)}.view{display:none}.view.active{display:block}table{width:100%;border-collapse:collapse;background:white;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);background:#fafcfb}.scroll{overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.pill{display:inline-block;border-radius:20px;background:var(--mint);color:var(--g);padding:4px 8px;font-size:11px}.danger{color:var(--red)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:12px;display:flex;gap:5px;overflow:auto}.brand{display:none}.nav{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:14px}.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🛡️ 현장안전포털</div><button class="nav active" data-v="dash">▦ 대시보드</button><button class="nav" data-v="inspect">☑ 현장 순회점검</button><button class="nav" data-v="calendar">▦ 일정 캘린더</button><button class="nav" data-v="report">▤ 보고서</button><button class="nav" data-v="law">⚖ 법령·안전 도우미</button></aside><main class="main"><div class="top"><div><div class="muted">SAFETY MANAGEMENT</div><h1 id="heading">관리자 대시보드</h1></div><div class="pill" id="today"></div></div>
<section id="dash" class="view active"><div class="row" style="justify-content:flex-end;margin-bottom:14px"><button class="btn primary" id="quickInspect" type="button" style="font-size:14px;padding:11px 16px">＋ 현장 순회점검 작성</button></div><div class="cards"><div class="card"><div class="muted">전체 점검</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">조치 대기</div><div class="num" id="pending">0</div></div><div class="card"><div class="muted">진행 중</div><div class="num" id="progress">0</div></div><div class="card"><div class="muted">조치 완료</div><div class="num" id="done">0</div></div></div><div class="grid"><div class="card"><h3>📅 이번 달 일정</h3><div class="row"><button class="btn" id="prev">‹</button><b id="month"></b><button class="btn" id="next">›</button></div><div id="miniCal" class="calendar"></div><div id="miniAgenda" class="list"></div></div><div class="card"><h3>☀ 오늘 날씨 <span class="muted">경남 창원시 성산구</span></h3><div class="weather"><div id="wicon" style="font-size:48px">🌤️</div><div><div class="temp" id="wtemp">--°</div><div id="wdesc" class="muted">날씨 불러오는 중</div></div></div><div class="muted" id="wstatus">외부 날씨 API 연결</div><button class="btn" id="refreshWeather">날씨 새로고침</button></div></div></section>
<section id="inspect" class="view"><div class="card"><h3>현장 순회점검 등록</h3><form id="inspectionForm"><div class="formgrid"><div><label>점검일</label><input name="date" type="date" required></div><div><label>점검자</label><input name="inspector" required placeholder="점검자"></div><div><label>현장 / 구역</label><input name="area" required placeholder="예: A동 2층"></div><div><label>위험도</label><select name="risk"><option>높음</option><option selected>보통</option><option>낮음</option></select></div><div class="full"><label>위험요인</label><textarea name="hazard" required></textarea></div><div class="full"><label>시정조치 및 개선대책</label><textarea name="action"></textarea></div><div><label>조치 담당자</label><input name="owner"></div><div><label>조치 기한</label><input name="due" type="date"></div><div><label>상태</label><select name="status"><option value="open">조치 대기</option><option value="progress">진행 중</option><option value="done">완료</option></select></div></div><p><button class="btn primary">점검 기록 저장</button></p></form></div><div class="card" style="margin-top:14px"><h3>점검 기록</h3><div class="scroll"><table><thead><tr><th>날짜</th><th>현장</th><th>위험요인</th><th>위험도</th><th>담당자</th><th>상태</th><th></th></tr></thead><tbody id="records"></tbody></table></div></div></section>
<section id="calendar" class="view"><div class="card"><div class="row"><button class="btn" id="prev2">‹</button><h3 id="month2"></h3><button class="btn" id="next2">›</button><button class="btn primary" id="newEvent">＋ 일정 작성</button></div><div id="fullCal" class="calendar"></div><p class="muted" id="selectedDate"></p><div id="agenda" class="list"></div></div><div class="card" style="margin-top:14px"><h3 id="eventHeading">일정 등록</h3><form id="eventForm"><div class="formgrid"><div><label>날짜</label><input name="date" type="date" required></div><div><label>시간</label><input name="time" type="time"></div><div class="full"><label>일정 제목</label><input name="title" required></div><div class="full"><label>상세 내용</label><textarea name="description"></textarea></div></div><input type="hidden" name="id"><p><button class="btn primary">일정 저장</button></p></form></div></section>
<section id="report" class="view"><div class="card"><h3>점검 보고서</h3><div class="row"><input type="date" id="from"><input type="date" id="to"><button class="btn" id="filterReport">조회</button><button class="btn primary" id="csv">CSV 다운로드</button><button class="btn" onclick="print()">인쇄 / PDF</button></div><div id="reportStats" class="list"></div></div></section>
<section id="law" class="view"><div class="card"><h3>산업안전 법령 검색</h3><form id="lawForm" class="row"><input id="lawQuery" placeholder="검색할 법령 또는 키워드" required><button class="btn primary">법령 검색</button></form><p class="muted">국가법령정보센터에서 최신 법령을 확인하세요.</p><h3>안전 도우미</h3><form id="helperForm" class="row"><input id="helperQuery" placeholder="예: 지게차 충돌 위험, 추락 위험"><button class="btn primary">대책 보기</button></form><pre id="answer" style="white-space:pre-wrap;font:13px/1.7 inherit"></pre><p class="muted">이 도우미는 키워드 기반 기초 안내입니다. 법적 판단과 최신 조항은 공식 법령을 확인하세요.</p></div></section>
</main></div><script>
const $=s=>document.querySelector(s),KEY='safety-records-v2',EKEY='safety-events-v2';let records=JSON.parse(localStorage.getItem(KEY)||'[]'),events=JSON.parse(localStorage.getItem(EKEY)||'[]'),cal=new Date(),selected=new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem(KEY,JSON.stringify(records)),saveE=()=>localStorage.setItem(EKEY,JSON.stringify(events)),iso=d=>d.toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#today').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());
document.querySelector('#quickInspect').onclick=()=>{document.querySelector('.nav[data-v=inspect]').click();document.querySelector('#inspectionForm').scrollIntoView({behavior:'smooth',block:'start'});};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.v));$('#heading').textContent=b.textContent.trim()});
function render(){const count=s=>records.filter(r=>r.status===s).length;$('#total').textContent=records.length;$('#pending').textContent=count('open');$('#progress').textContent=count('progress');$('#done').textContent=count('done');$('#records').innerHTML=records.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.hazard)+'</td><td>'+esc(r.risk)+'</td><td>'+esc(r.owner)+'</td><td>'+esc({open:'대기',progress:'진행',done:'완료'}[r.status])+'</td><td><button class="btn" onclick="delRecord(\''+r.id+'\')">삭제</button></td></tr>').join('')||'<tr><td colspan="7">등록된 점검 기록이 없습니다.</td></tr>';calendarRender();report()}
function delRecord(id){if(confirm('삭제할까요?')){records=records.filter(x=>x.id!==id);save();render()}}
$('#inspectionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());records.unshift({...v,id:crypto.randomUUID()});save();e.target.reset();e.target.elements.date.value=iso(new Date());render();alert('점검 기록을 저장했습니다.')};$('#inspectionForm').elements.date.value=iso(new Date());
function calendarRender(){const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),label=y+'년 '+(m+1)+'월';$('#month').textContent=$('#month2').textContent=label;['miniCal','fullCal'].forEach(id=>{let h=['일','월','화','수','목','금','토'].map(x=>'<div class="weekday">'+x+'</div>').join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=iso(d),has=events.some(e=>e.date===k);h+='<button class="'+(k===iso(new Date())?'today ':'')+(has?'mark ':'')+(k===selected?'sel':'')+'" onclick="pickDate(\''+k+'\')">'+d.getDate()+'</button>'}$('#'+id).innerHTML=h});$('#selectedDate').textContent=selected+' 선택됨';const day=events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const html=day.map(e=>'<div class="item"><div><b>'+esc(e.time||'종일')+' · '+esc(e.title)+'</b><br><small>'+esc(e.description)+'</small></div><div><button class="btn" onclick="editEvent(\''+e.id+'\')">수정</button> <button class="btn danger" onclick="delEvent(\''+e.id+'\')">삭제</button></div></div>').join('')||'<div class="muted">등록된 일정이 없습니다.</div>';$('#agenda').innerHTML=html;$('#miniAgenda').innerHTML=html}
function pickDate(k){selected=k;calendarRender();$('#eventForm').elements.date.value=k}
function shift(n){cal.setMonth(cal.getMonth()+n);calendarRender()}$('#prev').onclick=$('#prev2').onclick=()=>shift(-1);$('#next').onclick=$('#next2').onclick=()=>shift(1);$('#newEvent').onclick=()=>{pickDate(selected);$('#eventForm').reset();$('#eventForm').elements.date.value=selected;$('#eventHeading').textContent='일정 등록'};
$('#eventForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(v.id)events=events.map(x=>x.id===v.id?v:x);else events.push({...v,id:crypto.randomUUID()});selected=v.date;saveE();calendarRender();e.target.reset();$('#eventForm').elements.date.value=selected;alert('일정을 저장했습니다.')};function editEvent(id){let e=events.find(x=>x.id===id),f=$('#eventForm');Object.keys(e).forEach(k=>{if(f.elements[k])f.elements[k].value=e[k]});$('#eventHeading').textContent='일정 수정'}function delEvent(id){if(confirm('일정을 삭제할까요?')){events=events.filter(x=>x.id!==id);saveE();calendarRender()}}
function report(){let a=records.filter(r=>(!$('#from').value||r.date>=$('#from').value)&&(!$('#to').value||r.date<=$('#to').value));$('#reportStats').innerHTML='조회 결과 '+a.length+'건 · 완료 '+a.filter(x=>x.status==='done').length+'건 · 미완료 '+a.filter(x=>x.status!=='done').length+'건'}$('#filterReport').onclick=report;$('#csv').onclick=()=>{let a=records,rows=[['날짜','점검자','현장','위험도','위험요인','조치','담당자','기한','상태'],...a.map(r=>[r.date,r.inspector,r.area,r.risk,r.hazard,r.action,r.owner,r.due,r.status])],csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a1=document.createElement('a');a1.href=url;a1.download='현장안전점검.csv';a1.click();URL.revokeObjectURL(url)};
$('#lawForm').onsubmit=e=>{e.preventDefault();open('https://www.law.go.kr/lsSc.do?query='+encodeURIComponent($('#lawQuery').value),'_blank','noopener')};$('#helperForm').onsubmit=e=>{e.preventDefault();let q=$('#helperQuery').value,t=q.toLowerCase(),tips=['작업 전 위험성평가와 작업계획을 확인하세요.','위험구역 출입을 통제하고 작업자에게 위험요인과 비상조치를 공유하세요.','위험 제거·대체 및 공학적 대책을 우선 검토하고 보호구를 확인하세요.'];if(/추락|비계|사다리/.test(t))tips=['작업발판·안전난간·개구부 덮개 등 추락방호 상태 확인','안전대 부착설비 및 체결상태 확인','기상상태와 출입통제 확인'];if(/지게차|차량/.test(t))tips=['보행자와 차량 동선 분리','운전자 자격·후진경보·시야 확보 확인','유도자 배치 및 작업반경 통제'];$('#answer').textContent='['+q+' 안전 점검 제안]\n'+tips.map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\n정확한 법령 조항은 국가법령정보센터에서 확인하세요.'};
async function weather(){let u='https://api.open-meteo.com/v1/forecast?latitude=35.219&longitude=128.681&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia%2FSeoul';$('#wstatus').textContent='날씨 조회 중…';try{let r=await fetch(u);if(!r.ok)throw Error(r.status);let d=await r.json(),c=d.current,icons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',80:'🌦️',95:'⛈️'};$('#wtemp').textContent=Math.round(c.temperature_2m)+'°';$('#wicon').textContent=icons[c.weather_code]||'🌡️';$('#wdesc').textContent='체감 '+Math.round(c.apparent_temperature)+'° · 습도 '+c.relative_humidity_2m+'% · 풍속 '+Math.round(c.wind_speed_10m)+'km/h';$('#wstatus').textContent='창원시 성산구 · Open-Meteo'}catch(e){$('#wstatus').textContent='날씨 연결 실패: 인터넷 연결 후 새로고침해 주세요.';$('#wdesc').textContent='외부 날씨 API에 연결할 수 없습니다.'}}$('#refreshWeather').onclick=weather;
render();pickDate(selected);$('#eventForm').elements.date.value=selected;weather();
</script></body></html>
